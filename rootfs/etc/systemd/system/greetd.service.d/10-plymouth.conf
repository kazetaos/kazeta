# Hand the display over from plymouth to greetd the way display managers do: plymouth quits right
# before the session starts but leaves its last frame on screen, so the boot splash stays up until
# gamescope draws its first frame, with no console or black screen shown in between.
# plymouth-quit.service would quit without keeping the frame, so greetd takes its place.
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-quit.service plymouth-start.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth quit --retain-splash
